backend:
  name: github
  repo: alimuntaj805-ux/Muntaj
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Home Page"
        name: "home"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"

